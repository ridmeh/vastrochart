[project]
name = "vastrochart-compute"
version = "0.1.0"
description = "Stateless Vedic + K.P. astrology chart compute — FastAPI + FastMCP, single container."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyswisseph>=2.10",
  "fastmcp>=0.2",
  "pydantic>=2.9",
  "structlog>=24",
  "python-ulid>=2",
  # azure-monitor-opentelemetry deferred to Week 3 per tasks/week-1-day-by-day.md
]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vastrochart_compute"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "swisseph"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
